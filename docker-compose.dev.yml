services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bifi}
      POSTGRES_USER: ${POSTGRES_USER:-bifi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - '5432:5432'
    volumes:
      - pgdata_dev:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-bifi}']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    volumes:
      - redisdata_dev:/data

  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - '${VITE_PORT:-5173}:${VITE_PORT:-5173}'
      - '4983:4983'
    volumes:
      - .:/app
      - /app/node_modules # preserve container node_modules
      - uploads_data_dev:/app/uploads
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-bifi}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-bifi}
      REDIS_URL: redis://redis:6379
      NODE_ENV: development
      VITE_DEV_TOOLS: 'true'
      UPLOAD_DIR: /app/uploads
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  migrate:
    build:
      context: .
      dockerfile: Dockerfile.dev
    command: npm run db:migrate
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-bifi}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-bifi}
    depends_on:
      db:
        condition: service_healthy
    profiles:
      - tools

volumes:
  pgdata_dev:
  redisdata_dev:
  uploads_data_dev:
