services:
  db:
    image: ghcr.io/letsdrinksometea/bifi-postgres:latest
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bifi}
      POSTGRES_USER: ${POSTGRES_USER:-bifi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - bifi_pgdata:/var/lib/postgresql/data
    networks:
      - internal
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-bifi}']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
      --save 60 1
      --loglevel warning
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
    volumes:
      - bifi_redisdata:/data
    networks:
      - internal
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli -a "$$REDIS_PASSWORD" --no-auth-warning ping']
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    image: ghcr.io/letsdrinksometea/bifi:latest
    ports:
      - '3000:3000'
    volumes:
      - bifi_uploads_data:/app/uploads
    tmpfs:
      - /tmp:size=64m,mode=1777
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-bifi}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-bifi}
      REDIS_URL: redis://:${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}@redis:6379
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET in .env}
      APP_URL: ${APP_URL:?Set APP_URL in .env}
    networks:
      - internal
      - public
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

networks:
  internal:
    internal: true
  public: {}

volumes:
  bifi_pgdata:
  bifi_redisdata:
  bifi_uploads_data:
